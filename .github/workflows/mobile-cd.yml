# ============================================================================
#  CD — Mobile (React Native / Expo)
# ============================================================================

name: CD - Mobile (Expo / Android APK)

on:
  push:
    branches: [master]
    tags:    ["v*.*.*"]

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv android/app/build/outputs/apk/release/app-release.apk \
             android/app/build/outputs/apk/release/healthai-coach-${SHORT_SHA}.apk
          echo "APK_PATH=android/app/build/outputs/apk/release/healthai-coach-${SHORT_SHA}.apk" >> $GITHUB_ENV
          echo "APK_NAME=healthai-coach-${SHORT_SHA}.apk" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}